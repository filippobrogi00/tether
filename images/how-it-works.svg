<rect x="419.2" y="274.6" width="11" height="8.4" rx="2" fill="#F5F1E6"/>
<text x="437" y="282" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#F5F1E6" text-anchor="start" letter-spacing="0.6">SSH</text>
<text x="440" y="124" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#F5F1E6" text-anchor="middle" >Terminal and port forwarding</text>
<text x="440" y="141" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A8B3C7" text-anchor="middle" >share the same connection</text>
<circle cx="419" cy="210" r="10" fill="#F5F1E6" stroke="#14213D" stroke-width="2.5"/>
<text x="419" y="214" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#14213D" text-anchor="middle" >2</text>
<text x="435" y="214.5" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#F4B63F" text-anchor="start" >Push</text>
<text x="440" y="232" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A8B3C7" text-anchor="middle" >the moment a file changes</text>
<circle cx="421" cy="322" r="10" fill="#F5F1E6" stroke="#14213D" stroke-width="2.5"/>
<text x="421" y="326" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#14213D" text-anchor="middle" >4</text>
<text x="437" y="326.5" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#7ADBC8" text-anchor="start" >Pull</text>
<text x="440" y="344" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A8B3C7" text-anchor="middle" >after each command, on window focus</text>
<text x="440" y="360" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A8B3C7" text-anchor="middle" >and every 60 seconds</text>
<circle cx="296" cy="84" r="10" fill="#F5F1E6" stroke="#14213D" stroke-width="2.5"/>
<text x="296" y="88" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#14213D" text-anchor="middle" >1</text>
<circle cx="584" cy="84" r="10" fill="#F5F1E6" stroke="#14213D" stroke-width="2.5"/>
<text x="584" y="88" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#14213D" text-anchor="middle" >3</text>
<line x1="40" y1="390" x2="840" y2="390" stroke="#34466C" stroke-width="1"/>
<circle cx="50" cy="418" r="10" fill="#F5F1E6" stroke="#14213D" stroke-width="2.5"/>
<text x="50" y="422" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#14213D" text-anchor="middle" >1</text>
<text x="68" y="422.5" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#F5F1E6" text-anchor="start" >Edit locally</text>
<text x="40" y="445" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A8B3C7" text-anchor="start" >Files live on your disk, so</text>
<text x="40" y="461" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A8B3C7" text-anchor="start" >IntelliSense, linters and Git</text>
<text x="40" y="477" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A8B3C7" text-anchor="start" >respond instantly.</text>
<circle cx="254" cy="418" r="10" fill="#F5F1E6" stroke="#14213D" stroke-width="2.5"/>
<text x="254" y="422" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#14213D" text-anchor="middle" >2</text>
<text x="272" y="422.5" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#F5F1E6" text-anchor="start" >Tether pushes</text>
<text x="244" y="445" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A8B3C7" text-anchor="start" >Each change uploads at once</text>
<text x="244" y="461" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A8B3C7" text-anchor="start" >and is swapped into place</text>
<text x="244" y="477" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A8B3C7" text-anchor="start" >atomically on the server.</text>
<circle cx="458" cy="418" r="10" fill="#F5F1E6" stroke="#14213D" stroke-width="2.5"/>
<text x="458" y="422" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#14213D" text-anchor="middle" >3</text>
<text x="476" y="422.5" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#F5F1E6" text-anchor="start" >Run remotely</text>
<text x="448" y="445" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A8B3C7" text-anchor="start" >Build and test in a terminal</text>
<text x="448" y="461" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A8B3C7" text-anchor="start" >that runs on the server, in</text>
<text x="448" y="477" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A8B3C7" text-anchor="start" >your project folder.</text>
<circle cx="662" cy="418" r="10" fill="#F5F1E6" stroke="#14213D" stroke-width="2.5"/>
<text x="662" y="422" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#14213D" text-anchor="middle" >4</text>
<text x="680" y="422.5" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#F5F1E6" text-anchor="start" >Results come back</text>
<text x="652" y="445" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A8B3C7" text-anchor="start" >Files the server creates or</text>
<text x="652" y="461" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A8B3C7" text-anchor="start" >changes are pulled into</text>
<text x="652" y="477" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A8B3C7" text-anchor="start" >your workspace.</text>
</svg>
