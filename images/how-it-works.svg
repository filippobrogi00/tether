<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-labelledby="t d">
<title id="t">How Tether works</title>
<desc id="d">VS Code and every extension run on your computer against a local working copy. One encrypted SSH connection pushes local changes to a folder on your server, pulls back files the server creates, and carries the terminal and forwarded ports. Nothing is installed on the server.</desc>
<rect width="880" height="500" rx="18" fill="#14213D"/>
<text x="40" y="46" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#F5F1E6" text-anchor="start" >Your computer</text>
<text x="40" y="66" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A8B3C7" text-anchor="start" >Every extension runs here</text>
<rect x="40" y="84" width="256" height="96" rx="8" fill="#0D172B" stroke="#34466C" stroke-width="1.25"/>
<line x1="40" y1="108" x2="296" y2="108" stroke="#34466C" stroke-width="1"/>
<circle cx="54" cy="96" r="3.5" fill="#34466C"/>
<circle cx="66" cy="96" r="3.5" fill="#34466C"/>
<circle cx="78" cy="96" r="3.5" fill="#34466C"/>
<text x="94" y="100" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A8B3C7" text-anchor="start" >main.c</text>
<text x="54" y="128" font-family="'IBM Plex Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="11" font-weight="400" fill="#A8B3C7" text-anchor="start" opacity="0.6" >12</text>
<text x="80" y="128" font-family="'IBM Plex Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#F5F1E6" text-anchor="start" xml:space="preserve">int main(void) {</text>
<text x="54" y="146" font-family="'IBM Plex Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="11" font-weight="400" fill="#A8B3C7" text-anchor="start" opacity="0.6" >13</text>
<text x="80" y="146" font-family="'IBM Plex Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#F5F1E6" text-anchor="start" xml:space="preserve">    return run_tests();</text>
<text x="54" y="164" font-family="'IBM Plex Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="11" font-weight="400" fill="#A8B3C7" text-anchor="start" opacity="0.6" >14</text>
<text x="80" y="164" font-family="'IBM Plex Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#F5F1E6" text-anchor="start" xml:space="preserve">}</text>
<rect x="40" y="188" width="76" height="24" rx="6" fill="#0D172B" stroke="#34466C" stroke-width="1.25"/>
<rect x="40" y="198" width="256" height="120" rx="8" fill="#0D172B" stroke="#34466C" stroke-width="1.25"/>
<text x="54" y="224" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#F5F1E6" text-anchor="start" >Local working copy</text>
<text x="54" y="240" font-family="'IBM Plex Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="10.5" font-weight="400" fill="#A8B3C7" text-anchor="start" >~/projects/app</text>
<text x="54" y="264" font-family="'IBM Plex Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#F5F1E6" text-anchor="start" >src/main.c</text>
<text x="282" y="264" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#F4B63F" text-anchor="end" >edited</text>
<text x="54" y="282" font-family="'IBM Plex Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#F5F1E6" text-anchor="start" >Makefile</text>
<text x="54" y="300" font-family="'IBM Plex Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#F5F1E6" text-anchor="start" >build/out.log</text>
<text x="282" y="300" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#7ADBC8" text-anchor="end" >pulled</text>
<text x="40" y="344" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#F5F1E6" text-anchor="start" >Tether runs here too.</text>
<text x="40" y="361" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A8B3C7" text-anchor="start" >It knows which side changed each file.</text>
<text x="584" y="46" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#F5F1E6" text-anchor="start" >Your server</text>
<text x="584" y="66" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#A8B3C7" text-anchor="start" >Your commands run here</text>
<rect x="584" y="84" width="256" height="96" rx="8" fill="#0D172B" stroke="#34466C" stroke-width="1.25"/>
<line x1="584" y1="108" x2="840" y2="108" stroke="#34466C" stroke-width="1"/>
<circle cx="598" cy="96" r="3.5" fill="#34466C"/>
<circle cx="610" cy="96" r="3.5" fill="#34466C"/>
<circle cx="622" cy="96" r="3.5" fill="#34466C"/>
<text x="638" y="100" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A8B3C7" text-anchor="start" >Terminal on the server</text>
<text x="598" y="128" font-family="'IBM Plex Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#F5F1E6" text-anchor="start" >$ make test</text>
<text x="598" y="146" font-family="'IBM Plex Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#A8B3C7" text-anchor="start" >cc -O2 -o build/app src/main.c</text>
<text x="598" y="164" font-family="'IBM Plex Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#A8B3C7" text-anchor="start" >./build/app &gt; build/out.log</text>
<rect x="584" y="188" width="76" height="24" rx="6" fill="#0D172B" stroke="#34466C" stroke-width="1.25"/>
<rect x="584" y="198" width="256" height="120" rx="8" fill="#0D172B" stroke="#34466C" stroke-width="1.25"/>
<text x="598" y="224" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#F5F1E6" text-anchor="start" >Remote folder</text>
<text x="598" y="240" font-family="'IBM Plex Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="10.5" font-weight="400" fill="#A8B3C7" text-anchor="start" >/home/you/projects/app</text>
<text x="598" y="264" font-family="'IBM Plex Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#F5F1E6" text-anchor="start" >src/main.c</text>
<text x="826" y="264" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#F4B63F" text-anchor="end" >pushed</text>
<text x="598" y="282" font-family="'IBM Plex Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#F5F1E6" text-anchor="start" >Makefile</text>
<text x="598" y="300" font-family="'IBM Plex Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#F5F1E6" text-anchor="start" >build/out.log</text>
<text x="826" y="300" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#7ADBC8" text-anchor="end" >new</text>
<text x="584" y="344" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#F5F1E6" text-anchor="start" >Nothing is installed here.</text>
<text x="584" y="361" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#A8B3C7" text-anchor="start" >No VS Code Server, no agent, no daemon.</text>
<path d="M350,261 C400,283 480,283 530,261" fill="none" stroke="#5269A0" stroke-width="41.5" stroke-linecap="round"/>
<path d="M350,261 C400,283 480,283 530,261" fill="none" stroke="#243861" stroke-width="38.5" stroke-linecap="round"/>
