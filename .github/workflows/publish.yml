name: Publish Extension
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
jobs:
  publish:
    environment: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
      - run: npm ci
      - run: npx @vscode/vsce publish --oidc
      - run: npx ovsx publish --trusted-publishing